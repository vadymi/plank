<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --border: #222;
    --green: #00ff87;
    --red: #ff3b3b;
    --yellow: #ffd60a;
    --dim: #444;
    --text: #f0f0f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #cam-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #000;
  }

  #video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    transition: opacity 0.5s;
  }
  #video.ready { opacity: 1; }

  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* Status badge top-center */
  #status-badge {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 6px 18px;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    backdrop-filter: blur(8px);
    transition: all 0.3s;
    white-space: nowrap;
  }
  #status-badge.good { color: var(--green); border-color: var(--green); }
  #status-badge.bad  { color: var(--red);   border-color: var(--red); }
  #status-badge.warn { color: var(--yellow); border-color: var(--yellow); }

  /* Feedback tip */
  #tip {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--yellow);
    letter-spacing: 0.05em;
    text-align: center;
    max-width: 90%;
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  #tip.visible { opacity: 1; }

  /* Bottom panel — always visible, opaque buttons */
  #panel {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  /* Overlay panel: sits on top of camera, semi-transparent */
  #overlay-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 16px 12px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  /* Timer overlay — corner box, full opacity */
  #timer-corner {
    position: absolute;
    top: 12px;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 6px 14px 4px;
    backdrop-filter: blur(8px);
    transition: left 0.4s, right 0.4s;
    pointer-events: none;
  }
  #timer-corner.left  { left: 12px; right: auto; }
  #timer-corner.right { right: 12px; left: auto; }

  #timer-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 58px;
    line-height: 1;
    letter-spacing: 2px;
    color: var(--text);
    transition: color 0.2s;
  }
  #timer-display.running { color: var(--green); }
  #timer-display.paused  { color: var(--red); }

  #best-wrap { text-align: center; }
  #best-label { font-size: 8px; letter-spacing: 0.15em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  #best-time  { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: rgba(255,255,255,0.5); }

  /* Form bars — semi-transparent overlay */
  #form-bars {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    opacity: 0.75;
  }
  .bar-item { display: flex; flex-direction: column; gap: 4px; direction: ltr; }
  .bar-label { font-size: 9px; letter-spacing: 0.12em; color: rgba(255,255,255,0.6); text-transform: uppercase; }
  .bar-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s, background 0.3s;
  }
  .bar-fill.ok   { background: var(--green); }
  .bar-fill.warn { background: var(--yellow); }
  .bar-fill.bad  { background: var(--red); }

  /* Buttons */
  #btn-row {
    display: flex;
    gap: 10px;
  }

  #btn-start {
    flex: 1;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    -webkit-appearance: none;
  }
  #btn-start:active { transform: scale(0.97); opacity: 0.85; }
  #btn-start.stop { background: var(--red); color: #fff; }
  #btn-start:disabled { background: #333; color: #555; pointer-events: none; }

  #btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--dim);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    -webkit-appearance: none;
  }
  #btn-reset:active { border-color: var(--text); color: var(--text); }

  #btn-cam {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--dim);
    font-size: 18px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.3s;
    -webkit-appearance: none;
  }
  #btn-cam:active { border-color: var(--text); color: var(--text); transform: rotate(180deg); }

  /* Loading overlay */
  #loader {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    transition: opacity 0.6s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 4px;
    color: var(--green);
  }
  #loader-sub { font-size: 11px; color: var(--dim); letter-spacing: 0.1em; text-align:center; line-height:1.6; max-width:80%; }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid #222;
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Warning border blink */
  #warn-border {
    position: absolute;
    inset: 0;
    border: 5px solid transparent;
    border-radius: 0;
    pointer-events: none;
    transition: border-color 0.15s;
    z-index: 5;
  }
  #warn-border.warn { border-color: var(--yellow); }
  @keyframes border-blink {
    0%, 100% { border-color: transparent; }
    50%       { border-color: var(--yellow); }
  }
  #warn-border.blinking { animation: border-blink 0.5s ease-in-out infinite; }

  /* Kid voice bubble */
  #kid-bubble {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 214, 10, 0.92);
    color: #000;
    border-radius: 18px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-align: center;
    max-width: 85%;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 6;
    white-space: nowrap;
  }
  #kid-bubble.visible { opacity: 1; }
  #kid-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-bottom: none;
    border-top-color: rgba(255,214,10,0.92);
  }
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    transform: scaleX(-1);
  }

  /* Pulse ring when good */
  #pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid var(--green);
    opacity: 0;
    pointer-events: none;
  }
  @keyframes pulse-out {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
  }
  #pulse-ring.pulse { animation: pulse-out 0.6s ease-out forwards; }
</style>

<!-- MediaPipe via CDN -->
<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';
window._PoseLandmarker = PoseLandmarker;
window._FilesetResolver = FilesetResolver;

<script>
// ─── State ─────────────────────────────────────────────────────────────────
let poseLandmarker = null;
let animFrame = null;
let isRunning = false;
let elapsedMs = 0;
let lastTick = null;
let bestMs = 0;
let lastPoseGood = false;
let goodSince = null;
let badSince  = null;
let facingMode = 'environment'; // default: back camera
const GRACE_START_MS = 1000;
const GRACE_PAUSE_MS = 500;

// ─── DOM ───────────────────────────────────────────────────────────────────
const video       = document.getElementById('video');
const skelCanvas  = document.getElementById('skel-canvas');
const ctx         = skelCanvas.getContext('2d');
const statusBadge = document.getElementById('status-badge');
const tipEl       = document.getElementById('tip');
const timerEl     = document.getElementById('timer-display');
const bestEl      = document.getElementById('best-time');
const btnStart    = document.getElementById('btn-start');
const btnReset    = document.getElementById('btn-reset');
const btnCam      = document.getElementById('btn-cam');
const timerCorner = document.getElementById('timer-corner');
const warnBorder  = document.getElementById('warn-border');
const kidBubble   = document.getElementById('kid-bubble');
const loader      = document.getElementById('loader');
const loaderSub   = document.getElementById('loader-sub');
const pulseRing   = document.getElementById('pulse-ring');
const barHips     = document.getElementById('bar-hips');
const barBack     = document.getElementById('bar-back');
const barNeck     = document.getElementById('bar-neck');

// ─── Kid Voice System ──────────────────────────────────────────────────────
let kidSpeaking = false;
let kidCooldown = false;
let kidBubbleTimer = null;

const KID_LINES = {

  hips_low: [
    "Your bummy is drooping! LIFT IT UP!",
    "No saggy bum! This is not nap time!",
    "You look like a sad bridge! FIX IT!",
    "Hips UP! UP UP UP! Like RIGHT NOW!",
    "Your tummy is gonna touch! Don't you dare!",
    "Big people keep hips UP! Do it RIGHT!",
  ],

  hips_high: [
    "You're not doing yoga! Hips DOWN!",
    "Stop making a mountain! Flat back!",
    "That's a triangle not a plank! DOWN!",
    "Your bum is in the SKY! Come down!",
    "Flat like a table! Not a tent!",
    "You're making a roof! We live OUTSIDE!",
  ],

  neck: [
    "HEAD UP! You're not looking for coins!",
    "Stop staring at the floor! It's boring down there!",
    "Chin up soldier! You can cry later!",
    "Your head is falling off! HOLD IT UP!",
    "Look forward! The floor isn't going anywhere!",
    "Neck straight! Pretend you're very important!",
    "Eyes forward! Look like a CHAMPION!",
  ],

  legs: [
    "Bent knees is cheating and I can SEE it!",
    "Straight legs! You have two of them USE THEM!",
    "Unlock those knees! All the way straight!",
    "Your legs are all bendy! Stop that!",
    "Knees straight or it doesn't COUNT!",
    "You have stiff legs somewhere! Find them!",
  ],

  shoulders: [
    "Don't let your shoulders collapse! Push the floor!",
    "Shoulder blades BACK! You're not a shrimp!",
    "Stop sinking into your arms! PUSH!",
    "Shoulders over elbows! Not in your EARS!",
    "You're collapsing! Like a very big soggy cracker!",
  ],

  core: [
    "Squeeze your tummy! Pretend you're wearing tight pants!",
    "Belly button to spine! SQUEEZE IT!",
    "Tight tummy! Like you swallowed a basketball!",
    "Your middle is all wobbly! HOLD IT!",
    "Core tight! You have one don't you?!",
  ],

  // Warning zone — minor drift, still in range, gentle nudge
  minor: [
    "Hey! I see you getting lazy! Not yet!",
    "Almost wobbly! Come on, tighten up!",
    "Don't you DARE give up now!",
    "I can see it slipping! Hold HOLD HOLD!",
    "You were doing SO good! Stay there!",
    "Nooooo! Stay straight! Almost almost!",
    "Keep it! Just a little more! You can do it!",
    "I'm watching you! Don't move!",
    "Wiggle detected! Fix it before I count to three!",
    "One more second! One more! You're so close!",
    "Your body said no but YOU say YES!",
    "This is the hard part! This is why you're here!",
  ],

  // Generic / unclassified errors
  generic: [
    "Something is wrong and I don't know what but FIX IT!",
    "You look very wrong right now! Adjust everything!",
    "I don't know what that is but it's NOT a plank!",
    "My teddy bear does better planks than this!",
    "Reset! Reset! Everything is bad right now!",
    "The camera is confused and so am I! FIX YOUR BODY!",
    "You call THAT a plank?! My goldfish does better!",
  ],
};

function pickLine(category) {
  const lines = KID_LINES[category] || KID_LINES.generic;
  return lines[Math.floor(Math.random() * lines.length)];
}

function speakKid(text) {
  if (!text || kidSpeaking) return;
  kidSpeaking = true;

  kidBubble.textContent = '🧒 ' + text;
  kidBubble.classList.add('visible');
  clearTimeout(kidBubbleTimer);
  kidBubbleTimer = setTimeout(() => kidBubble.classList.remove('visible'), 4500);

  const utt = new SpeechSynthesisUtterance(text);
  utt.rate   = 1.45;
  utt.pitch  = 2.0;
  utt.volume = 1.0;

  const voices = speechSynthesis.getVoices();
  const kidVoice = voices.find(v =>
    /female|girl|child|junior|zira|samantha|karen|moira|tessa/i.test(v.name)
  ) || voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (kidVoice) utt.voice = kidVoice;

  utt.onend  = () => { kidSpeaking = false; };
  utt.onerror = () => { kidSpeaking = false; };
  speechSynthesis.speak(utt);
}

function triggerKidVoice(category) {
  if (kidCooldown || kidSpeaking) return;
  kidCooldown = true;
  setTimeout(() => { kidCooldown = false; }, 11000);
  speakKid(pickLine(category));
}

// Map tip text to kid line category
function tipToCategory(tip, hipAngleDeg) {
  if (!tip) return 'minor';
  if (/raise hips/i.test(tip))    return 'hips_low';
  if (/lower hips/i.test(tip))    return 'hips_high';
  if (/head|neck|lift head|drop head/i.test(tip)) return 'neck';
  if (/legs|knee/i.test(tip))     return 'legs';
  if (/shoulder/i.test(tip))      return 'shoulders';
  if (/core|belly|tummy/i.test(tip)) return 'core';
  return 'minor';
}


// ─── Helpers ───────────────────────────────────────────────────────────────
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function setTip(msg) {
  if (msg) { tipEl.textContent = msg; tipEl.classList.add('visible'); }
  else      { tipEl.classList.remove('visible'); }
}

function setBar(el, score) {
  // score 0–100, higher = better
  el.style.width = score + '%';
  el.className = 'bar-fill ' + (score > 70 ? 'ok' : score > 40 ? 'warn' : 'bad');
}

function triggerPulse() {
  pulseRing.classList.remove('pulse');
  void pulseRing.offsetWidth;
  pulseRing.classList.add('pulse');
}

// ─── Angle helpers ─────────────────────────────────────────────────────────
function angle3(a, b, c) {
  // angle at point b
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x*cb.x + ab.y*cb.y;
  const mag = Math.sqrt((ab.x**2+ab.y**2)*(cb.x**2+cb.y**2));
  if (mag === 0) return 180;
  return Math.acos(Math.max(-1, Math.min(1, dot/mag))) * (180/Math.PI);
}

function bodyAngle(shoulder, hip, ankle) {
  // angle of body line (shoulder→ankle) relative to ground
  const dx = ankle.x - shoulder.x;
  const dy = ankle.y - shoulder.y;
  return Math.atan2(dy, dx) * (180/Math.PI);
}

// ─── Pose evaluation ───────────────────────────────────────────────────────
function evalPose(lm) {
  // Indices (MediaPipe Pose Landmarker)
  const nose      = lm[0];
  const lShoulder = lm[11]; const rShoulder = lm[12];
  const lHip      = lm[23]; const rHip      = lm[24];
  const lKnee     = lm[25]; const rKnee     = lm[26];
  const lAnkle    = lm[27]; const rAnkle    = lm[28];

  // Average left/right
  const shoulder = { x:(lShoulder.x+rShoulder.x)/2, y:(lShoulder.y+rShoulder.y)/2 };
  const hip      = { x:(lHip.x+rHip.x)/2,           y:(lHip.y+rHip.y)/2           };
  const knee     = { x:(lKnee.x+rKnee.x)/2,         y:(lKnee.y+rKnee.y)/2         };
  const ankle    = { x:(lAnkle.x+rAnkle.x)/2,       y:(lAnkle.y+rAnkle.y)/2       };

  // Visibility gating
  const minVis = 0.35;
  const visible = [lShoulder, rShoulder, lHip, rHip, lAnkle, rAnkle]
    .every(p => (p.visibility ?? 1) > minVis);
  if (!visible) return { valid: false };

  // 1. Hip alignment: angle at hip in shoulder–hip–ankle
  const hipAngleDeg = angle3(shoulder, hip, ankle);
  // Perfect plank → ~170–180°; sagging or raised → lower
  const hipScore = Math.min(100, Math.max(0, (hipAngleDeg - 130) / 50 * 100));

  // 2. Back straightness: angle at shoulder in hip–shoulder–nose (neck alignment)
  const neckAngleDeg = angle3(hip, shoulder, nose);
  // Head should be neutral (~170°); dropping or craning → lower
  const neckScore = Math.min(100, Math.max(0, (neckAngleDeg - 120) / 60 * 100));

  // 3. Leg straightness: angle at knee
  const kneeAngleDeg = angle3(hip, knee, ankle);
  const legScore = Math.min(100, Math.max(0, (kneeAngleDeg - 130) / 50 * 100));

  // Composite
  const overall = hipScore * 0.5 + neckScore * 0.25 + legScore * 0.25;
  const good = hipScore > 59 && overall > 59;

  // Tips
  let tip = null;
  if (hipScore < 59) {
    tip = hipAngleDeg < 160 ? '▲ Raise hips — keep body straight' : '▼ Lower hips — don\'t pike';
  } else if (neckScore < 59) {
    tip = neckAngleDeg < 155 ? '↑ Lift head — neutral spine' : '↓ Drop head slightly';
  } else if (legScore < 59) {
    tip = '⬛ Straighten legs';
  }

  // Head X position (0=left, 1=right) for corner switching
  const headX = lm[0].x;

  return { valid: true, good, tip, hipScore, neckScore, legScore, overall, headX };
}

// ─── Draw skeleton ──────────────────────────────────────────────────────────
const CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[24,26],[26,28],
  [0,11],[0,12]
];

function drawSkeleton(lm, good) {
  const W = skelCanvas.width, H = skelCanvas.height;
  ctx.clearRect(0, 0, W, H);

  const color = good ? 'rgba(0,255,135,0.85)' : 'rgba(255,59,59,0.85)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';

  for (const [a, b] of CONNECTIONS) {
    const pa = lm[a], pb = lm[b];
    if (!pa || !pb) continue;
    if ((pa.visibility??1) < 0.3 || (pb.visibility??1) < 0.3) continue;
    ctx.beginPath();
    ctx.moveTo(pa.x * W, pa.y * H);
    ctx.lineTo(pb.x * W, pb.y * H);
    ctx.stroke();
  }

  // Joints
  for (let i = 0; i < lm.length; i++) {
    const p = lm[i];
    if ((p.visibility ?? 1) < 0.3) continue;
    if (![0,11,12,13,14,15,16,23,24,25,26,27,28].includes(i)) continue;
    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, 4, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
  }
}

// ─── Timer logic ──────────────────────────────────────────────────────────
function tickTimer(now) {
  if (!isRunning) return;
  if (lastTick !== null) elapsedMs += now - lastTick;
  lastTick = now;
  timerEl.textContent = fmtTime(elapsedMs);
  if (elapsedMs > bestMs) {
    bestMs = elapsedMs;
    bestEl.textContent = fmtTime(bestMs);
  }
}

// ─── Main detection loop ──────────────────────────────────────────────────
let lastVideoTime = -1;

function detect() {
  animFrame = requestAnimationFrame(detect);

  if (!poseLandmarker || video.readyState < 2) return;

  // Sync canvas size to video display size
  const rect = video.getBoundingClientRect();
  if (skelCanvas.width !== rect.width || skelCanvas.height !== rect.height) {
    skelCanvas.width  = rect.width;
    skelCanvas.height = rect.height;
  }

  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const result = poseLandmarker.detectForVideo(video, performance.now());
  const now = performance.now();

  if (!result.landmarks || result.landmarks.length === 0) {
    ctx.clearRect(0, 0, skelCanvas.width, skelCanvas.height);
    statusBadge.className = 'warn';
    statusBadge.textContent = 'No person detected';
    setTip('Position yourself sideways to the camera');
    // Grace: pause if running
    if (isRunning) {
      if (!badSince) badSince = now;
      if (now - badSince > GRACE_PAUSE_MS) {
        isRunning = false; lastTick = null;
        timerEl.classList.remove('running'); timerEl.classList.add('paused');
      }
    }
    goodSince = null;
    return;
  }

  const lm = result.landmarks[0];
  const ev = evalPose(lm);
  drawSkeleton(lm, ev.valid && ev.good);

  if (!ev.valid) {
    statusBadge.className = 'warn';
    statusBadge.textContent = 'Adjust camera angle';
    setTip('Show full body — side view works best');
    goodSince = null;
    if (isRunning) {
      if (!badSince) badSince = now;
      if (now - badSince > GRACE_PAUSE_MS) {
        isRunning = false; lastTick = null;
        timerEl.classList.remove('running'); timerEl.classList.add('paused');
      }
    }
    return;
  }

  // Update bars
  setBar(barHips, ev.hipScore);
  setBar(barBack, ev.legScore);
  setBar(barNeck, ev.neckScore);

  // Switch timer corner away from head
  // headX is 0..1 in video space; video is mirrored so we flip
  if (ev.headX !== undefined) {
    const mirroredX = 1 - ev.headX;
    const headOnRight = mirroredX > 0.5;
    // Timer corner opposite to head
    timerCorner.className = 'timer-corner ' + (headOnRight ? 'left' : 'right');
    // Bars order: Neck always on head side
    // headOnRight → normal order: Hips | Back | Neck
    // headOnLeft  → reversed:     Neck | Back | Hips
    document.getElementById('form-bars').style.direction = headOnRight ? 'ltr' : 'rtl';
  }

  if (ev.good) {
    badSince = null;
    warnBorder.className = ''; // clear any warning
    statusBadge.className = 'good';

    if (!isRunning) {
      if (!goodSince) { goodSince = now; }
      const waited = now - goodSince;
      const countdown = Math.ceil((GRACE_START_MS - waited) / 1000);
      statusBadge.textContent = waited < GRACE_START_MS
        ? `Hold form… ${countdown}`
        : 'Good form ✓';
      if (waited >= GRACE_START_MS) {
        isRunning = true; lastTick = now;
        timerEl.classList.add('running'); timerEl.classList.remove('paused');
        triggerPulse();
        statusBadge.textContent = 'Holding ✓';
      }
    } else {
      statusBadge.textContent = 'Holding ✓';
      tickTimer(now);
    }
    setTip(null);

  } else {
    // Determine if in warning zone (59–75) or fully bad (<59)
    const worstScore = Math.min(ev.hipScore, ev.overall);
    const inWarningZone = worstScore >= 59 && worstScore < 75;

    goodSince = null;

    if (inWarningZone && isRunning) {
      // Blinking yellow border — still running
      warnBorder.className = 'blinking';
      statusBadge.className = 'warn';
      statusBadge.textContent = 'Hold it! ⚠';
      setTip(ev.tip);
      tickTimer(now);
      badSince = null; // reset bad timer — not pausing yet
      // Trigger kid voice
      triggerKidVoice(tipToCategory(ev.tip));
    } else {
      warnBorder.className = '';
      statusBadge.className = 'bad';
      statusBadge.textContent = 'Fix form!';
      setTip(ev.tip);

      if (isRunning) {
        if (!badSince) badSince = now;
        if (now - badSince > GRACE_PAUSE_MS) {
          isRunning = false; lastTick = null;
          timerEl.classList.remove('running'); timerEl.classList.add('paused');
          warnBorder.className = '';
        }
      }
      if (isRunning) tickTimer(now);
    }
  }
}

// ─── Init ──────────────────────────────────────────────────────────────────
function setLoader(msg, pct) {
  const t = new Date().toISOString().substr(11,12);
  loaderSub.innerHTML = (pct !== undefined
    ? `<div style="margin-bottom:6px;font-size:13px;color:#00ff87">${pct}%</div>`
    : '') +
    `<div>${msg}</div>` +
    `<div style="font-size:10px;color:#444;margin-top:4px">${t}</div>`;
}

async function init() {
  setLoader('Requesting camera…', 5);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    setLoader('Camera OK — starting video…', 15);
    video.srcObject = stream;
    await video.play();
    video.classList.add('ready');
    setLoader('Video playing ✓', 20);

    // Zoom out as wide as possible
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.();
    if (caps?.zoom) {
      const minZoom = caps.zoom.min ?? 1;
      const targetZoom = Math.max(minZoom, Math.min(0.6, caps.zoom.max));
      try {
        await track.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        setLoader(`Zoom set to ${targetZoom.toFixed(2)} ✓`, 22);
      } catch(ze) {
        setLoader(`Zoom not applied: ${ze.message}`, 22);
      }
    } else {
      setLoader('Zoom not supported on this camera', 22);
    }
  } catch(e) {
    setLoader(`❌ Camera failed: ${e.name} — ${e.message}`);
    return;
  }

  setLoader('Waiting for MediaPipe module…', 25);
  try {
    if (!window._PoseLandmarker) {
      setLoader('Waiting for MediaPipe ES module to load…', 28);
      const timeout = new Promise((_, rej) =>
        setTimeout(() => rej(new Error('MediaPipe module timeout after 15s')), 15000)
      );
      await Promise.race([
        new Promise(res => window.addEventListener('mediapipe-ready', res, { once: true })),
        timeout
      ]);
    }
    setLoader('MediaPipe module loaded ✓', 35);
  } catch(e) {
    setLoader(`❌ MediaPipe module failed: ${e.message}`);
    return;
  }

  const PoseLandmarker = window._PoseLandmarker;
  const FilesetResolver = window._FilesetResolver;

  setLoader('Loading WASM vision tasks…', 40);
  let vision;
  try {
    vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    setLoader('WASM loaded ✓', 60);
  } catch(e) {
    setLoader(`❌ WASM load failed: ${e.message}`);
    return;
  }

  setLoader('Downloading pose model (~5MB)…', 65);
  try {
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    setLoader('Pose model ready ✓', 95);
  } catch(e) {
    // GPU failed — retry with CPU
    setLoader(`GPU failed (${e.message}) — retrying with CPU…`, 70);
    try {
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate: 'CPU'
        },
        runningMode: 'VIDEO',
        numPoses: 1,
        minPoseDetectionConfidence: 0.5,
        minPosePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      setLoader('Pose model ready (CPU) ✓', 95);
    } catch(e2) {
      setLoader(`❌ Model load failed: ${e2.message}`);
      return;
    }
  }

  setLoader('Starting…', 100);
  await new Promise(r => setTimeout(r, 300));
  loader.classList.add('hidden');
  btnStart.disabled = false;
  statusBadge.textContent = 'Ready — get into position';
  detect();
}

// ─── Button handlers ───────────────────────────────────────────────────────
btnStart.addEventListener('click', () => {
  if (isRunning) {
    // Manual stop
    isRunning = false; lastTick = null; goodSince = null; badSince = null;
    timerEl.classList.remove('running'); timerEl.classList.add('paused');
    btnStart.textContent = 'START'; btnStart.classList.remove('stop');
    statusBadge.className = '';
    statusBadge.textContent = 'Stopped';
  } else {
    // Reset & arm: detection loop will auto-start when form is good
    elapsedMs = 0; timerEl.textContent = '0:00';
    timerEl.classList.remove('running','paused');
    goodSince = null; badSince = null;
    btnStart.textContent = 'STOP'; btnStart.classList.add('stop');
    statusBadge.textContent = 'Get into plank…';
  }
});

btnReset.addEventListener('click', () => {
  isRunning = false; lastTick = null; goodSince = null; badSince = null;
  elapsedMs = 0; bestMs = 0;
  timerEl.textContent = '0:00'; timerEl.className = '';
  bestEl.textContent = '0:00';
  btnStart.textContent = 'START'; btnStart.classList.remove('stop');
  statusBadge.className = '';
  statusBadge.textContent = 'Ready — get into position';
  warnBorder.className = '';
  kidBubble.classList.remove('visible');
  setTip(null);
  setBar(barHips, 0); setBar(barBack, 0); setBar(barNeck, 0);
});

async function switchCamera() {
  // Stop current stream
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  // Toggle
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  // Flip video mirror: front camera needs mirroring, back does not (or vice versa — user preference)
  video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(-1)';
  // Restart stream
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    // Zoom out as wide as possible
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.();
    if (caps?.zoom) {
      const minZoom = caps.zoom.min ?? 1;
      const targetZoom = Math.max(minZoom, Math.min(0.6, caps.zoom.max));
      try { await track.applyConstraints({ advanced: [{ zoom: targetZoom }] }); } catch {}
    }
  } catch(e) {
    statusBadge.textContent = 'Camera switch failed';
  }
}

btnCam.addEventListener('click', switchCamera);

init();
</script>
